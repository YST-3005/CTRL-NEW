<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LabelLens Guardian</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="kicker">Extension · demo</p>
      <h1>Guardian Lens</h1>
      <p class="note">Works only on the local Helion Market storefront. Not a universal shopping scanner.</p>
      <label>Flag vegan conflicts <input id="vegan" type="checkbox" /></label>
      <label>Peanuts <input id="peanuts" type="checkbox" checked /></label>
      <label>Milk <input id="milk" type="checkbox" checked /></label>
      <p id="status">Idle</p>
      <a href="http://localhost:3000/store" target="_blank" rel="noreferrer">Open mock storefront</a>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
